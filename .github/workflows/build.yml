name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Report size
        shell: bash
        run: ls -l target/release/8823.exe
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item -Path assets/fonts/OFL.txt,assets/fonts/egui/NotoEmoji-OFL.txt,assets/fonts/egui/emoji-icon-font-mit-license.txt -Destination dist/licenses
          Compress-Archive -Path target/release/8823.exe,dist/licenses -DestinationPath dist/8823-win.zip -CompressionLevel Optimal -Force
          Get-Item dist/8823-win.zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: 8823-windows-x64
          path: dist/8823-win.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build .app (Apple Silicon)
        run: ./scripts/bundle-mac.sh
      - name: Report size
        run: |
          ls -l dist/8823-mac.zip dist/8823.app/Contents/MacOS/8823
          du -sk dist/8823.app
      - uses: actions/upload-artifact@v4
        with:
          name: 8823-mac-arm64
          path: dist/8823-mac.zip

  # Publish both platform archives together. Main updates the rolling build,
  # and version tags have their own release.
  publish-release:
    needs: [windows, macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/8823-windows-x64/8823-win.zip \
            dist/8823-mac-arm64/8823-mac.zip \
            --verify-tag \
            --title "8823 $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
      - name: Replace the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lR dist
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          stamp=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            dist/8823-windows-x64/8823-win.zip \
            dist/8823-mac-arm64/8823-mac.zip \
            --target "$GITHUB_SHA" \
            --title "最新ビルド ($stamp, $short)" \
            --latest \
            --notes "main の最新ビルドです（コミット $GITHUB_SHA）。新しいビルドが成功するたびに自動で置き換わります。

          - Windows (x64): 8823-win.zip（展開して 8823.exe を実行）
          - Mac (Apple Silicon): 8823-mac.zip"
