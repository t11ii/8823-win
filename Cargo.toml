[package]
name = "app8823"
version = "0.1.0"
edition = "2024"
description = "A fast, keyboard-driven file manager for Windows with first-class Japanese support"
license = "MIT"

[[bin]]
name = "8823"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Speed first, then size. The app itself is built at opt-level 3 (above). Dependencies
# default to size-optimised code, which is fine for what runs once or rarely (window
# and platform setup, clipboard, trash, font loading)...
[profile.release.package."*"]
opt-level = "s"

# ...except everything on a hot path, which stays at full speed:
# per-frame UI and text layout,
[profile.release.package.egui]
opt-level = 3
[profile.release.package.epaint]
opt-level = 3
[profile.release.package.harfrust]
opt-level = 3
# name folding for sorting and filtering,
[profile.release.package.unicode-normalization]
opt-level = 3
[profile.release.package.tinyvec]
opt-level = 3
# and image decoding for thumbnails.
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.zune-core]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.weezl]
opt-level = 3
[profile.release.package.tiff]
opt-level = 3
